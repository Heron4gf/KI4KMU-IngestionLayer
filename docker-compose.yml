services:
  api:
    build: .
    container_name: pdf-ingestion-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      # Langfuse Tracing Configuration
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      
      # Database and Infrastructure Hosts/Ports
      - CHROMA_HOST=${CHROMA_HOST:-chromadb-ingestion}
      - CHROMA_PORT=${CHROMA_PORT:-8000}
      - CHROMA_COLLECTION=${CHROMA_COLLECTION:-documents}
      - GRAPHDB_URL=${GRAPHDB_URL:-http://graphdb-ingestion:7200}
      - GRAPHDB_REPOSITORY=${GRAPHDB_REPOSITORY:-rag-repo}
      - GRAPHDB_BASE_NS=${GRAPHDB_BASE_NS:-http://ki4kmu.fhnw.ch/ontology#}
      - GRAPHDB_USER=${GRAPHDB_USER:-}
      - GRAPHDB_PASSWORD=${GRAPHDB_PASSWORD:-}
      
      # AI Captioning Config
      - CAPTIONING_AI_BASE_URL=${CAPTIONING_AI_BASE_URL}
      - CAPTIONING_AI_MODEL=${CAPTIONING_AI_MODEL}
      - CAPTIONING_AI_API_KEY=${CAPTIONING_AI_API_KEY}
      - CAPTION_MAX_TOKENS=${CAPTION_MAX_TOKENS:-256}
      - CAPTIONER_PROMPT_PATH=${CAPTIONER_PROMPT_PATH:-/prompts/captioner.md}
      
      - SECTION_EXTRACTOR_URL=http://section-extractor:8003

      - HF_TOKEN=${HF_TOKEN}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - HF_HOME=/ki4kmu_data/.hf_cache
      - EMBEDDING_MODEL_PATH=${EMBEDDING_MODEL_PATH:-/ki4kmu_data/embedding-model}
    volumes:
      - ./prompts/captioner.md:/prompts/captioner.md:ro
      - ki4kmu_data:/ki4kmu_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - chromadb-ingestion
      - graphdb-ingestion
    networks:
      - backend

  chromadb-ingestion:
    image: chromadb/chroma:latest
    container_name: chromadb-ingestion
    restart: unless-stopped
    volumes:
      - ki4kmu_data:/ki4kmu_data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/ki4kmu_data/chroma-data
    ports:
      - "8000:8000"
    networks:
      - backend

  graphdb-ingestion:
    image: ontotext/graphdb:${GRAPHDB_VERSION:-10.7.0}
    container_name: graphdb-ingestion
    restart: unless-stopped
    ports:
      - "${GRAPHDB_PORT:-7200}:7200"
    volumes:
      - ki4kmu_data:/ki4kmu_data
    environment:
      - GDB_JAVA_OPTS=${GDB_JAVA_OPTS:--Xmx2g -Dgraphdb.home=/ki4kmu_data/graphdb}
    networks:
      - backend

  section-extractor:
    build: ./section_extractor
    container_name: section-extractor
    restart: unless-stopped
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      - EXTRACTOR_BASE_URL=${EXTRACTOR_BASE_URL}
      - EXTRACTOR_API_KEY=${EXTRACTOR_API_KEY}
      - EXTRACTOR_MODEL_ID=${EXTRACTOR_MODEL_ID}
      - EXTRACTOR_PROMPT_PATH=${EXTRACTOR_PROMPT_PATH:-/prompts/extract.md}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      - ./prompts:/prompts:ro
    networks:
      - backend

  gui:
    build: ./gui
    container_name: pdf-ingestion-gui
    restart: unless-stopped
    ports:
      - "${GUI_PORT:-8501}:8501"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:8001/v1
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:

volumes:
  ki4kmu_data:
    name: ki4kmu_data